services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gharflow
      POSTGRES_USER: gharflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gharflow -d gharflow"]
      interval: 5s
      timeout: 3s
      retries: 12
  ocr:
    build: ./ocr
    environment:
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN:?Set OCR_INTERNAL_TOKEN in .env}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://gharflow:${POSTGRES_PASSWORD}@db:5432/gharflow
      OCR_URL: http://ocr:8000
      OCR_INTERNAL_TOKEN: ${OCR_INTERNAL_TOKEN}
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      COOKIE_SECURE: "false"
      DEMO_ENABLED: "${DEMO_ENABLED:-true}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
volumes:
  db_data:
  uploads:
